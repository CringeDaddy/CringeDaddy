<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CringeDaddy · Live Time</title>
<style>
:root{color-scheme:dark;--r:#ff0033}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;color:#f2f2f2;font-family:'Courier New',Courier,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 14px}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#ff00330a 3px 4px);pointer-events:none}
h1{margin:8px 0 0;font-size:clamp(28px,7vw,48px);color:#fff;text-shadow:0 0 14px var(--r);text-align:center}
.sub{color:var(--r);margin:4px 0 18px;text-align:center;font-size:14px}
.card{width:100%;max-width:320px;border:1px solid var(--r);border-radius:14px;padding:12px 14px;margin:10px 0;background:#080008;box-shadow:0 0 18px #ff003333;text-align:center;position:relative}
.lbl{color:#8b949e;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.clock{font-size:clamp(30px,9vw,42px);font-weight:700;color:var(--r);text-shadow:0 0 16px var(--r);margin:6px 0}
.date{color:#ccc;font-size:14px}
.where{color:#fff;margin-top:6px;font-size:14px}
.live{position:absolute;top:12px;right:14px;font-size:11px;color:var(--r);animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:.15}}
.pen{max-width:100%;height:auto;margin-top:10px}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.links a{color:#fff;text-decoration:none;border:1px solid var(--r);padding:8px 14px;border-radius:6px;font-size:13px;font-weight:700}
.links a:hover{background:var(--r);box-shadow:0 0 14px var(--r)}
</style></head><body>
<h1>CringeDaddy</h1>
<div class="sub">Rudra Das · Cyber Security Researcher | VAPT | IoT Specialist</div>
<div class="card"><span class="live">● LIVE</span><div class="lbl">Your local time</div><div class="clock" id="me">--:--:--</div><div class="date" id="med"></div><div class="where" id="mew">locating...</div></div>
<img class="pen" src="assets/penguin.svg" width="300" alt="Hacker penguin">
<div class="links"><a href="https://github.com/CringeDaddy">GitHub</a><a href="https://www.linkedin.com/in/rudradas11/">LinkedIn</a><a href="https://tryhackme.com/p/RudraDas13">TryHackMe</a></div>
<script>
var tz;try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
function $(i){return document.getElementById(i)}
function t(z){var o={hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};if(z)o.timeZone=z;return new Date().toLocaleTimeString('en-GB',o)}
function d(z){var o={weekday:'long',year:'numeric',month:'long',day:'numeric'};if(z)o.timeZone=z;return new Date().toLocaleDateString('en-GB',o)}
function tick(){$('me').textContent=t(tz);$('med').textContent=d(tz)}
tick();setInterval(tick,1000);
$('mew').textContent='Timezone: '+(tz||'unknown');
try{fetch('https://ipapi.co/json/').then(function(r){return r.json()}).then(function(j){if(j&&j.country_code){var n=new Intl.DisplayNames(['en'],{type:'region'}).of(j.country_code);$('mew').textContent='📍 '+(j.city?j.city+', ':'')+n+' · '+(tz||j.timezone)}}).catch(function(){})}catch(e){}
</script></body></html>
