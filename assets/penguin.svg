<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="Waving penguin saying hi">
<style>
.pg-mono{font-family:'Courier New',Courier,monospace;font-weight:700}
.pg-wave{transform-origin:0 0;animation:pg-wave .6s ease-in-out infinite alternate}
@keyframes pg-wave{from{transform:rotate(10deg)}to{transform:rotate(60deg)}}
.pg-bob{animation:pg-bob 1.6s ease-in-out infinite alternate}
@keyframes pg-bob{to{transform:translateY(-5px)}}
.pg-eye{transform-box:fill-box;transform-origin:center;animation:pg-blink 4s infinite}
@keyframes pg-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pg-cur{animation:pg-cur 1s steps(1) infinite}
@keyframes pg-cur{50%{opacity:0}}
.pg-glow{animation:pg-glow 2s ease-in-out infinite alternate}
@keyframes pg-glow{from{stroke-opacity:.35}to{stroke-opacity:1}}
.pg-scan{animation:pg-scan 4s linear infinite}
@keyframes pg-scan{from{transform:translateY(-20px)}to{transform:translateY(270px)}}
</style>
<rect width="420" height="260" rx="14" fill="#000" stroke="#ff0033" stroke-opacity=".5"/>
<rect class="pg-scan" width="420" height="18" fill="#ff0033" opacity=".08"/>
<ellipse cx="110" cy="226" rx="52" ry="8" fill="#ff0033" opacity=".25"/>
<g class="pg-bob">
  <ellipse cx="88" cy="214" rx="16" ry="7" fill="#ff6a00"/>
  <ellipse cx="132" cy="214" rx="16" ry="7" fill="#ff6a00"/>
  <ellipse cx="110" cy="152" rx="50" ry="62" fill="#111" stroke="#ff0033" stroke-width="3"/>
  <ellipse cx="110" cy="166" rx="31" ry="42" fill="#f2f2f2"/>
  <ellipse cx="58" cy="152" rx="11" ry="34" transform="rotate(15 58 152)" fill="#111" stroke="#ff0033" stroke-width="3"/>
  <g transform="translate(152,126)"><g class="pg-wave">
    <ellipse cx="0" cy="-28" rx="11" ry="32" fill="#111" stroke="#ff0033" stroke-width="3"/>
  </g></g>
  <circle cx="110" cy="84" r="38" fill="#111" stroke="#ff0033" stroke-width="3"/>
  <ellipse cx="110" cy="91" rx="26" ry="23" fill="#f2f2f2"/>
  <circle class="pg-eye" cx="99" cy="84" r="5" fill="#000"/>
  <circle class="pg-eye" cx="121" cy="84" r="5" fill="#000"/>
  <circle cx="100.5" cy="82.5" r="1.6" fill="#fff"/>
  <circle cx="122.5" cy="82.5" r="1.6" fill="#fff"/>
  <polygon points="101,96 119,96 110,108" fill="#ff6a00"/>
</g>
<polygon points="190,76 166,90 190,98" fill="#000" stroke="#ff0033" stroke-width="2"/>
<rect class="pg-glow" x="190" y="40" width="215" height="80" rx="12" fill="#000" stroke="#ff0033" stroke-width="2"/>
<polygon points="188,78 190,78 190,96 188,96" fill="#000"/>
<text class="pg-mono" x="205" y="72" font-size="16" fill="#ff0033">hi! I'm CringeDaddy</text>
<text class="pg-mono" x="205" y="98" font-size="13" fill="#fff">welcome to my profile</text>
<rect class="pg-cur" x="371" y="88" width="8" height="12" fill="#ff0033"/>
<text class="pg-mono" x="205" y="160" font-size="12" fill="#888">&gt; sudo hack --ethically</text>
<text class="pg-mono" x="205" y="182" font-size="12" fill="#ff0033">&gt; status: online</text>
<rect class="pg-cur" x="319" y="173" width="7" height="11" fill="#ff0033"/>
</svg>
